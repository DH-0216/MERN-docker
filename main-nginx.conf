server {
    listen 80;
    server_name _;

    # Hide Nginx version for security
    server_tokens off;

    # Maximum client request body size (matches backend / frontend)
    client_max_body_size 10m;

    # Docker internal DNS resolver (enables dynamic IP re-resolution without Nginx restarts)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Lightweight healthcheck endpoint for Docker & load balancers
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 1. Forward backend API requests to the Node.js server container
    location /api/ {
        set $upstream_server http://server:5000;
        proxy_pass $upstream_server;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. Forward /admin/ requests to the Admin container
    # Rewrite removes /admin/ prefix before proxying to admin container
    location /admin/ {
        set $upstream_admin http://admin:80;
        rewrite ^/admin/(.*) /$1 break;
        proxy_pass $upstream_admin;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Redirect /admin to /admin/ (adds trailing slash if user omits it)
    location = /admin {
        return 301 $scheme://$http_host/admin/;
    }

    # 3. Forward all other requests to the Client container (Default)
    location / {
        set $upstream_client http://client:80;
        proxy_pass $upstream_client;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
