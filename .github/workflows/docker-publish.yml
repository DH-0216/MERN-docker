name: Build & Push Docker Images

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Docker environment to build'
        required: true
        type: choice
        default: 'production'
        options:
          - production
          - dev
      push_to_hub:
        description: 'Push images to Docker Hub (requires secrets)'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ server, client, admin ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Environment & Configuration
        id: config
        run: |
          # Determine if this build is production or development
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.target_env }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TARGET_ENV="production"
          else
            TARGET_ENV="dev"
          fi

          if [ "$TARGET_ENV" = "production" ]; then
            SUFFIX="-prod"
            DOCKERFILE="./${{ matrix.service }}/Dockerfile.prod"
          else
            SUFFIX="-dev"
            DOCKERFILE="./${{ matrix.service }}/Dockerfile"
          fi

          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$DOCKER_USER" ]; then
            DOCKER_USER="dulajhashmika"
          fi

          IMAGE_NAME="${DOCKER_USER}/${{ matrix.service }}${SUFFIX}"

          echo "target_env=$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "docker_user=$DOCKER_USER" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Credentials
        id: check-creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub secrets (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN) not set. Images will be built but not pushed."
          fi

      - name: Log in to Docker Hub
        if: steps.check-creds.outputs.has_creds == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_to_hub == 'true')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.config.outputs.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ${{ steps.config.outputs.dockerfile }}
          push: ${{ steps.check-creds.outputs.has_creds == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_to_hub == 'true') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
