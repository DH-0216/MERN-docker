name: Build & Push Production Docker Images

on:
  workflow_run:
    workflows: ["CI - Test & Lint"]
    branches: [ main ]
    types:
      - completed
  workflow_dispatch:
    inputs:
      push_to_hub:
        description: 'Push images to Docker Hub (requires secrets)'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Production (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    strategy:
      fail-fast: false
      matrix:
        service: [ server, client, admin ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Determine Configuration
        id: config
        run: |
          # Strip any accidental newlines or trailing spaces from secret
          DOCKER_USER=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr -d '\r\n[:space:]')
          if [ -z "$DOCKER_USER" ]; then
            DOCKER_USER="dulajhashmika"
          fi

          IMAGE_NAME="${DOCKER_USER}/${{ matrix.service }}-prod"
          DOCKERFILE="./${{ matrix.service }}/Dockerfile.prod"

          echo "dockerfile=${DOCKERFILE}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "docker_user=${DOCKER_USER}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Credentials
        id: check-creds
        run: |
          DOCKER_USER=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr -d '\r\n[:space:]')
          DOCKER_TOKEN=$(echo "${{ secrets.DOCKERHUB_TOKEN }}" | tr -d '\r\n[:space:]')
          if [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_TOKEN" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub secrets (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN) not set. Images will be built but not pushed."
          fi

      - name: Log in to Docker Hub
        if: steps.check-creds.outputs.has_creds == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_to_hub == 'true')
        uses: docker/login-action@v3
        with:
          username: ${{ steps.config.outputs.docker_user }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.config.outputs.image_name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ${{ steps.config.outputs.dockerfile }}
          push: ${{ steps.check-creds.outputs.has_creds == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_to_hub == 'true') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # Job 2: Automated Deployment to EC2 via SSH
  # -------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - name: Check EC2 Deployment Secrets
        id: check-ec2
        run: |
          if [ -n "${{ secrets.EC2_HOST }}" ] && [ -n "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "has_ec2_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ec2_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EC2 deployment secrets (EC2_HOST / EC2_SSH_KEY) not set. Skipping automated deployment."
          fi

      - name: Deploy to EC2 via SSH
        if: steps.check-ec2.outputs.has_ec2_creds == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/mern-production
            docker compose -f compose.prod.yaml --env-file .env.production pull
            docker compose -f compose.prod.yaml --env-file .env.production up -d --remove-orphans
            docker image prune -f
