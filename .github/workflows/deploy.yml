name: Deploy to EC2 Production

on:
  workflow_run:
    workflows: ["Build & Push Production Docker Images"]
    branches: [ main ]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (e.g. latest, sha-xxxxxxx)'
        required: true
        default: 'latest'

concurrency:
  group: production-ec2-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2 & Verify Health
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Check EC2 Deployment Secrets
        id: check-ec2
        run: |
          if [ -n "${{ secrets.EC2_HOST }}" ] && [ -n "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "has_ec2_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ec2_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EC2 deployment secrets (EC2_HOST / EC2_SSH_KEY) not set. Skipping automated deployment."
          fi

      - name: Deploy, Health Check & Rollback via SSH
        if: steps.check-ec2.outputs.has_ec2_creds == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_TAG: ${{ github.event.inputs.image_tag || 'latest' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TARGET_TAG
          script: |
            set -u # Exit on undefined variables

            cd ~/mern-production || {
              echo "ERROR: Directory ~/mern-production not found!"
              exit 1
            }

            echo "=========================================="
            echo "  Starting Production Deployment          "
            echo "  Target Image Tag: ${TARGET_TAG}         "
            echo "=========================================="

            # Step 1: Backup currently running image IDs for reliable rollback
            echo "--> Backing up currently active images as :rollback-backup..."
            for svc in server client admin; do
              IMG_NAME=$(docker inspect --format='{{.Config.Image}}' "mern-docker-learning-${svc}-prod" 2>/dev/null || true)
              if [ -n "$IMG_NAME" ]; then
                REPO=$(echo "$IMG_NAME" | cut -d':' -f1)
                docker tag "$IMG_NAME" "${REPO}:rollback-backup" || true
                echo "    Backed up: ${REPO}:rollback-backup"
              fi
            done

            # Step 2: Pull and deploy the new images
            echo "--> Pulling and starting target images (${TARGET_TAG})..."
            export IMAGE_TAG="${TARGET_TAG}"
            DEPLOY_STATUS="success"

            if ! docker compose -f compose.prod.yaml --env-file .env.prod pull; then
              echo "ERROR: Failed to pull images for tag ${TARGET_TAG}"
              DEPLOY_STATUS="failed"
            elif ! docker compose -f compose.prod.yaml --env-file .env.prod up -d --wait --remove-orphans; then
              echo "ERROR: docker compose up failed or container healthcheck failed"
              DEPLOY_STATUS="failed"
            fi

            # Step 3: Perform live HTTP Health Probes (Application & Gateway)
            if [ "$DEPLOY_STATUS" = "success" ]; then
              echo "--> Verifying application HTTP health checks..."
              HEALTH_PASSED=false

              for attempt in $(seq 1 12); do
                API_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/api/v1/health || true)
                CLIENT_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/ || true)

                if [ "$API_CODE" = "200" ] && [ "$CLIENT_CODE" = "200" ]; then
                  echo "    Health checks PASSED on attempt ${attempt}! (API: 200, Client: 200)"
                  HEALTH_PASSED=true
                  break
                fi

                echo "    Attempt ${attempt}/12: API=${API_CODE}, Client=${CLIENT_CODE}. Retrying in 5s..."
                sleep 5
              done

              if [ "$HEALTH_PASSED" != "true" ]; then
                echo "ERROR: HTTP Health checks failed after 12 attempts!"
                DEPLOY_STATUS="failed"
              fi
            fi

            # Step 4: Handle Failure & Automated Rollback
            if [ "$DEPLOY_STATUS" = "failed" ]; then
              echo "=========================================="
              echo "  CRITICAL: HEALTH CHECK FAILED!          "
              echo "  Initiating automatic rollback...        "
              echo "=========================================="

              echo "--> Recent server logs before rollback:"
              docker compose -f compose.prod.yaml --env-file .env.prod logs --tail=60 server || true

              echo "--> Restoring previous working version (:rollback-backup)..."
              export IMAGE_TAG="rollback-backup"
              docker compose -f compose.prod.yaml --env-file .env.prod up -d --remove-orphans

              echo "--> Verifying rollback health..."
              sleep 5
              ROLLBACK_API=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/api/v1/health || true)
              echo "    Rollback completed. Current API status: ${ROLLBACK_API}"

              echo "Deployment failed and safely rolled back to previous version."
              exit 1
            fi

            # Step 5: Finalize Successful Deployment
            echo "--> Reloading Nginx configuration..."
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T main-nginx nginx -s reload || true

            echo "--> Cleaning up dangling images..."
            docker image prune -f

            echo "=========================================="
            echo "  Deployment completed successfully!      "
            echo "=========================================="
