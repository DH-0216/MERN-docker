services:
  mongo:
    image: mongo
    container_name: mongo-container

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

  backend:
    image: dulajhashmika/backend-dev:1.2.0
    container_name: backend-container

    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "5000:5000"

    depends_on:
      - mongo

    volumes:
      - ./backend:/app
      - /app/node_modules

    environment:
      PORT: ${PORT}
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}

  frontend:
    image: dulajhashmika/frontend-dev:1.3.0
    container_name: frontend-container

    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "5173:5173"

    depends_on:
      - backend

    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET}


volumes:
  mongo-data: