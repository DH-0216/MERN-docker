services:
  mongo:
    image: mongo
    container_name: mongo-container

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

  backend:
    image: dulajhashmika/backend:1.1.0
    container_name: backend-container

    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "5000:5000"

    depends_on:
      - mongo

    volumes:
      - ./backend:/app
      - /app/node_modules

    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/dockerDB
      JWT_SECRET: MERN_DOCKER_BACKEND_Super_Secret_Key_2026

  frontend:
    image: dulajhashmika/frontend:1.2.0
    container_name: frontend-container

    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "5173:5173"

    depends_on:
      - backend

    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"


volumes:
  mongo-data: