services:
  frontend:
    image: dulajhashmika/frontend:1.0.1
    container_name: frontend-container

    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  backend:
    image: dulajhashmika/backend:1.0.1
    container_name: backend-container

    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "5000:5000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    environment:
      PORT: 5000
