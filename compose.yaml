services:
  mongo:
    image: mongo:7.0
    container_name: mongo-container

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  server:
    image: dulajhashmika/server-dev:1.5.0
    container_name: server-container

    build:
      context: ./server
      dockerfile: Dockerfile

    ports:
      - "5000:5000"

    depends_on:
      mongo:
        condition: service_healthy

    volumes:
      - ./server:/app
      - /app/node_modules

    environment:
      PORT: ${PORT}
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}

    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  client:
    image: dulajhashmika/client-dev:1.5.0
    container_name: client-container

    build:
      context: ./client
      dockerfile: Dockerfile

    ports:
      - "5173:5173"

    depends_on:
      server:
        condition: service_healthy

    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://server:5000}

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  admin:
    image: dulajhashmika/admin-dev:1.1.0
    container_name: admin-container

    build:
      context: ./admin
      dockerfile: Dockerfile

    ports:
      - "5174:5174"

    depends_on:
      server:
        condition: service_healthy

    volumes:
      - ./admin:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://server:5000}

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5174/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


volumes:
  mongo-data: