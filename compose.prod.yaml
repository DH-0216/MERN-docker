services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    container_name: mongo-prod-container

    mem_limit: 1g
    cpus: "1.0"

    volumes:
      - mongo-data-prod:/data/db

    networks:
      - mern-network

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    image: dulajhashmika/backend-prod:1.0.0
    restart: unless-stopped
    container_name: backend-prod-container

    mem_limit: 512m
    cpus: "0.5"

    environment:
      NODE_ENV: production
      PORT: ${PORT:-5000}
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:80}

    depends_on:
      mongo:
        condition: service_healthy

    networks:
      - mern-network

    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: dulajhashmika/frontend-prod:1.0.0
    restart: unless-stopped
    container_name: frontend-prod-container

    mem_limit: 128m
    cpus: "0.25"

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - mern-network

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mongo-data-prod:

networks:
  mern-network:
