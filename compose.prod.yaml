services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    container_name: mongo-prod-container

    security_opt:
      - no-new-privileges:true

    pids_limit: 200

    mem_limit: 1g
    cpus: "1.0"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    volumes:
      - mongo-data-prod:/data/db

    networks:
      - backend-network

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  server:
    image: dulajhashmika/server-prod:1.2.0
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    init: true
    restart: unless-stopped
    container_name: server-prod-container
    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true

    read_only: true
    tmpfs:
      - /tmp

    pids_limit: 100

    mem_limit: 512m
    cpus: "0.5"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      NODE_ENV: production
      PORT: ${PORT}
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}

    depends_on:
      mongo:
        condition: service_healthy

    networks:
      - client-network
      - backend-network

    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  client:
    image: dulajhashmika/client-prod:1.2.0
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    container_name: client-prod-container

    security_opt:
      - no-new-privileges:true

    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

    pids_limit: 50

    mem_limit: 128m
    cpus: "0.25"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "8080:80"

    depends_on:
      server:
        condition: service_healthy

    networks:
      - client-network

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mongo-data-prod:

networks:
  client-network:
    # Client <-> Server communication; client has port mapping to host
  backend-network:
    internal: true
    # Server <-> MongoDB only; MongoDB cannot reach the internet
